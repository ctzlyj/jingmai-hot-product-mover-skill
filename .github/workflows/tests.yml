name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile scripts/jd_product_pipeline.py scripts/jd_product_mover.py scripts/jdo_listing_mvp.py scripts/jdo_large_body_bridge.py
